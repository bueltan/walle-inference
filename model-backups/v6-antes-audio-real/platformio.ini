[platformio]
default_envs = esp32-c3-full

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D EI_CLASSIFIER_TFLITE_ENABLE_CMSIS_NN=0
    -D EI_CLASSIFIER_TFLITE_ENABLE_ESP_NN=0
    -D EIDSP_USE_CMSIS_DSP=0
    -D EIDSP_USE_ESP_DSP=0
    -D WALLE_VERIFY_DCT=0

    -D WALLE_VERIFY_MEL=0


[env:esp32-c3-stream]
extends = env:esp32-c3
build_flags =
    ${env:esp32-c3.build_flags}
    -D WALLE_STREAM_TEST=1
    -D WALLE_PROFILE_MFCC=0

[env:esp32-c3-full]
extends = env:esp32-c3
build_flags =
    ${env:esp32-c3.build_flags}
    -D WALLE_PROFILE_MFCC=0
